<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yowell Ranch HOA Documents</title>
<style>
:root{--bg:#fafaf9;--card:#fff;--ink:#1f2937;--mute:#6b7280;--line:#e5e7eb;--acc:#1d4ed8;--hl:#fde68a;--hlink:#111827;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--card:#1b2434;--ink:#e5e7eb;--mute:#9ca3af;--line:#2f3b50;--acc:#8ab4ff;--hl:#7c5e10;--hlink:#fff}}
:root[data-theme="dark"]{--bg:#111827;--card:#1b2434;--ink:#e5e7eb;--mute:#9ca3af;--line:#2f3b50;--acc:#8ab4ff;--hl:#7c5e10;--hlink:#fff}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.hwrap{max-width:1100px;margin:0 auto}
h1{font:700 20px/1.2 Georgia,serif;margin:0 0 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=search]{flex:1 1 260px;min-width:0;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
select{padding:10px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%}
#status{color:var(--mute);font-size:14px;margin-top:6px}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:270px 1fr;gap:24px}
nav{position:sticky;top:110px;align-self:start;max-height:calc(100vh - 130px);overflow:auto;font-size:14px}
nav h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:14px 0 4px}
nav a{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:6px;color:var(--ink);text-decoration:none;cursor:pointer}
nav a:hover{background:var(--line)}
nav a.zero{opacity:.4}
nav .n{color:var(--mute);font-variant-numeric:tabular-nums}
details.doc{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
details.doc>summary{cursor:pointer;padding:12px 14px;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
details.doc>summary::-webkit-details-marker{display:none}
.t{font:600 17px/1.3 Georgia,serif}
.s{color:var(--mute);font-size:13px}
.pg{border-top:1px solid var(--line);padding:12px 14px}
.stamp{font-size:12px;color:var(--mute);margin-bottom:6px;font-variant-numeric:tabular-nums}
.pg p{margin:0 0 .8em;white-space:pre-line}
.pg.q p.dim{display:none}
.pg.q.full p.dim{display:block;opacity:.7}
.more,.scanbtn{font-size:13px;color:var(--acc);background:none;border:0;padding:0;cursor:pointer}
.scanbtn{margin-left:12px}
.cols{display:block}
.pg.split .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.scan{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.scan img{display:block;width:100%;height:auto}
.zoom{font-size:12px;color:var(--mute);padding:4px 8px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;background:var(--card)}
.zoom a{color:var(--acc)}
mark{background:var(--hl);color:var(--hlink);border-radius:2px;padding:0 1px}
.empty{color:var(--mute);padding:24px 0}
.note{font-size:13px;color:var(--mute);margin:0 0 14px}
@media (max-width:860px){main{grid-template-columns:1fr}nav{position:static;max-height:none}.pg.split .cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="hwrap">
<h1>Yowell Ranch HOA Documents</h1>
<div class="row">
<input id="q" type="search" placeholder='Search all documents, e.g. fence, "quorum", solar panels' autocomplete="off">
<select id="cat" aria-label="Filter by category"><option value="">All categories</option></select>
<label class="row" style="gap:6px;font-size:14px;color:var(--mute)"><input type="checkbox" id="scans"> Show scans</label>
</div>
<div id="status"></div>
</div></header>
<main>
<nav id="toc" aria-label="Documents"></nav>
<section id="out"></section>
</main>
<script>
const DATA=__DATA__;
const SCANS=__SCANS__;
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
DATA.forEach(d=>d.pages.forEach(p=>{p.paras=p.text.split(/\n{2,}/).map(x=>x.trim()).filter(Boolean);p.low=p.text.toLowerCase().replace(/\s+/g,' ');}));
const CATS=[...new Set(DATA.map(d=>d.cat))];
CATS.forEach(c=>{const o=document.createElement('option');o.value=o.textContent=c;$('#cat').appendChild(o);});

function parse(q){const terms=[];const re=/"([^"]+)"|(\S+)/g;let m;while((m=re.exec(q))){terms.push((m[1]||m[2]).toLowerCase().replace(/\s+/g,' '));}return terms;}
function hl(text,terms){let h=esc(text);if(!terms.length)return h;
 const r=new RegExp('('+terms.map(t=>rx(esc(t))).join('|')+')','gi');return h.replace(r,'<mark>$1</mark>');}
function pageHtml(d,p,terms){const q=terms.length>0;
 const ps=p.paras.map(x=>{const low=x.toLowerCase().replace(/\s+/g,' ');const hit=!q||terms.some(t=>low.includes(t));
  return '<p class="'+(hit?'':'dim')+'">'+hl(x,terms)+'</p>';}).join('');
 const key=d.id+'-'+p.n;
 return '<div class="pg'+(q?' q':'')+(showScans?' split':'')+'" data-key="'+key+'">'+
  '<div class="stamp">Page '+p.n+(p.stamp?' &middot; '+esc(p.stamp):'')+
  '<button class="scanbtn">'+(showScans?'Hide scan':'Show scan')+'</button></div>'+
  '<div class="cols"><div class="txt">'+ps+(q&&p.paras.length>1?'<button class="more">Show full page</button>':'')+'</div></div></div>';}
function mountScan(pg){const c=pg.querySelector('.cols');if(c.querySelector('.scan'))return;
 const k=pg.dataset.key,src=SCANS[k];if(!src)return;
 const w=document.createElement('div');w.className='scan';
 w.innerHTML='<img loading="lazy" alt="Scanned page" src="data:image/png;base64,'+src+'">'+
  '<div class="zoom"><span>Scanned original</span><a href="data:image/png;base64,'+src+'" target="_blank" rel="noopener">Open full size</a></div>';
 c.appendChild(w);}

let timer;let showScans=false;
function render(){
 const terms=parse($('#q').value.trim());const cat=$('#cat').value;
 const docs=DATA.filter(d=>!cat||d.cat===cat);
 const res=docs.map(d=>({d,pages:terms.length?d.pages.filter(p=>terms.every(t=>p.low.includes(t))):d.pages}));
 const shown=terms.length?res.filter(r=>r.pages.length):res;
 const total=shown.reduce((a,r)=>a+r.pages.length,0);
 $('#status').textContent=terms.length?(total?total+' matching page'+(total>1?'s':'')+' in '+shown.length+' document'+(shown.length>1?'s':''):'No pages match all search terms'):docs.length+' documents, '+docs.reduce((a,d)=>a+d.pages.length,0)+' pages (text recognized from scans)';
 // nav
 let nav='';CATS.forEach(c=>{const items=res.filter(r=>r.d.cat===c);if(!items.length)return;nav+='<h2>'+esc(c)+'</h2>';
  items.forEach(r=>{nav+='<a data-id="'+r.d.id+'" class="'+(terms.length&&!r.pages.length?'zero':'')+'"><span>'+esc(r.d.title)+'</span><span class="n">'+(terms.length?r.pages.length:r.d.pages.length)+'</span></a>';});});
 $('#toc').innerHTML=nav;
 // main
 const out=$('#out');out.innerHTML='';
 if(terms.length&&!shown.length){out.innerHTML='<div class="empty">Try fewer words, or check spelling. Scanned text can contain recognition errors.</div>';return;}
 if(!terms.length)out.insertAdjacentHTML('beforeend','<p class="note">Text was recognized from scanned PDFs and may contain small errors. Use "Show scan" on any page to check it against the recorded original.</p>');
 shown.forEach(r=>{const d=r.d;const el=document.createElement('details');el.className='doc';el.id='d-'+d.id;
  el.innerHTML='<summary><span><span class="t">'+esc(d.title)+'</span><br><span class="s">'+esc(d.sub)+'</span></span><span class="s">'+(terms.length?r.pages.length+' of ':'')+d.pages.length+' pp</span></summary><div class="body"></div>';
  const fill=()=>{if(el.dataset.f)return;el.dataset.f=1;el.querySelector('.body').innerHTML=r.pages.map(p=>pageHtml(d,p,terms)).join('');if(showScans)el.querySelectorAll('.pg').forEach(mountScan);};
  el.addEventListener('toggle',()=>{if(el.open)fill();});
  if(terms.length){el.open=true;fill();}
  out.appendChild(el);});
}
document.addEventListener('click',e=>{
 const sb=e.target.closest('.scanbtn');if(sb){const pg=sb.closest('.pg');const on=!pg.classList.contains('split');
  pg.classList.toggle('split',on);sb.textContent=on?'Hide scan':'Show scan';if(on)mountScan(pg);return;}
 const b=e.target.closest('.more');if(b){const pg=b.closest('.pg');pg.classList.toggle('full');b.textContent=pg.classList.contains('full')?'Show matches only':'Show full page';return;}
 const a=e.target.closest('nav a');if(a){const el=document.getElementById('d-'+a.dataset.id);if(el){el.open=true;el.scrollIntoView({behavior:'smooth',block:'start'});}}
});
$('#q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(render,180);});
$('#cat').addEventListener('change',render);
$('#scans').addEventListener('change',e=>{showScans=e.target.checked;render();});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus();}});
render();
</script>
</body>
</html>
